version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: bark-web_web_1
      APP_PORT: 8080

  web:
    image: secondark/bark-web:0.1.8
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - api
      - barkd

  api:
    image: secondark/bark-web-api:0.1.8
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/wallet:/wallet-data:ro
    environment:
      PORT: 4001
      WALLET_DIR: /wallet-data/.bark
      BARKD_URL: http://barkd:4000
      ARK_SERVER: https://ark.second.tech
      CHAIN_SOURCE: https://mempool.second.tech/api
      BARK_NETWORK: mainnet
    depends_on:
      - barkd

  barkd:
    image: secondark/bark:0.2.2
    restart: on-failure
    stop_grace_period: 1m
    # Run the entrypoint as root so it can take ownership of the bind-mounted
    # datadir (Umbrel creates ${APP_DATA_DIR} root-owned), then drop to the
    # unprivileged barkd user before exec'ing barkd. Without the chown, barkd
    # (uid 1000) cannot write auth_token, so the api proxy injects no bearer
    # token and every barkd call fails with "missing auth_token".
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/.bark && chown -R barkd:barkd /data && exec runuser -u barkd -- /usr/local/bin/barkd --port 4000 --host 0.0.0.0 --datadir /data/.bark
    volumes:
      - ${APP_DATA_DIR}/wallet:/data
