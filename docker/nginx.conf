server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Avoid caching index.html so deploys go live immediately.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Hashed static assets — cache long-term. No "always" flag: a 404 for a
  # stale chunk must stay uncacheable so a reload can recover after deploys.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Defense in depth against a proxy regression; the API's normalized check is
  # the real guard and also covers path variants this exact match does not.
  location = /api/barkd/api/v1/wallet/mnemonic {
    return 404;
  }

  # HTTP API proxy (config + backup + barkd-over-HTTP).
  location /api/ {
    proxy_pass http://api:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
  }

  # WebSocket directly to barkd (ticket-authed, no bearer to inject).
  location /barkd-ws/ {
    proxy_pass http://barkd:4000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
