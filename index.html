<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/dm-sans.ttf" crossorigin />
    <title>Bark Wallet</title>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('bark-web-settings-store')
          var theme = raw ? JSON.parse(raw).state.theme : 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
    <style>
      @font-face {
        font-family: 'DM Sans Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 1000;
        src: url(/fonts/dm-sans.ttf) format('truetype-variations');
      }
      html,
      body {
        margin: 0;
        background: oklch(1 0 0);
        color: oklch(0.145 0 0);
        font-family: 'DM Sans Variable', sans-serif;
      }
      html.dark,
      html.dark body {
        background: oklch(0.145 0 0);
        color: oklch(0.985 0 0);
      }
      #boot-loader {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      #boot-loader svg {
        width: 2rem;
        height: 2rem;
        color: oklch(0.145 0 0);
        animation: boot-spin 1s linear infinite;
      }
      html.dark #boot-loader svg {
        color: oklch(0.985 0 0);
      }
      #boot-loader p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.25rem;
        color: oklch(0.556 0 0);
      }
      html.dark #boot-loader p {
        color: oklch(0.708 0 0);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader svg {
          animation-duration: 0.01ms;
          animation-iteration-count: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root" class="antialiased font-sans">
      <div id="boot-loader" role="status" aria-label="Loading">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">

          />
        </svg>
        <p>Loading...</p>
      </div>
    </div>
    <!--barkd-token-->

  </body>
</html>
