services:
  web:
    build:
      context: .
      dockerfile: docker/bark-web.dev.Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_DEV_API_TARGET=http://api:4001
      - VITE_DEV_BARKD_TARGET=http://barkd:4000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/bark-web-api.dev.Dockerfile
    ports:
      - '4001:4001'
    volumes:
      - ./api:/app/api
      - /app/api/node_modules
      - wallet-data:/wallet-data:ro
    environment:
      - PORT=4001
      - WALLET_DIR=/wallet-data/.bark
      - BARKD_URL=http://barkd:4000
      - ARK_SERVER=${ARK_SERVER:-}
      - CHAIN_SOURCE=${CHAIN_SOURCE:-}
      - BARK_NETWORK=${BARK_NETWORK:-signet}
    depends_on:
      - barkd

  barkd:
    build:
      context: .
      dockerfile: docker/barkd.Dockerfile
      args:
        BARK_VERSION: ${BARK_VERSION:-0.1.4}
        BARKD_SHA256_AMD64: ${BARKD_SHA256_AMD64:-}
        BARKD_SHA256_ARM64: ${BARKD_SHA256_ARM64:-}
    ports:
      - '4000:4000'
    volumes:
      - wallet-data:/data

volumes:
  wallet-data:
