services:
  bark-web:
    build:
      context: .
      dockerfile: docker/bark-web.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - wallet-data:/wallet-data:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - barkd
    entrypoint: ["/bin/sh", "/app/docker/bark-web-entrypoint.sh"]

  bark:
    container_name: bark
    build:
      context: .
      dockerfile: docker/bark.Dockerfile
      args:
        BARK_VERSION: ${BARK_VERSION:-0.1.0-beta.8}
    volumes:
      - wallet-data:/root

  barkd:
    container_name: barkd
    build:
      context: .
      dockerfile: docker/barkd.Dockerfile
      args:
        BARK_VERSION: ${BARK_VERSION:-0.1.0-beta.8}
    ports:
      - "4000:4000"
    volumes:
      - wallet-data:/root

volumes:
  wallet-data:
