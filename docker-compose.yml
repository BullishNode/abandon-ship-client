services:
  web:
    build:
      context: .
      dockerfile: docker/bark-web.dev.Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - vite-cache:/app/node_modules/.vite
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_DEV_API_TARGET=http://api:4001
      - VITE_DEV_BARKD_TARGET=http://barkd:4000
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/bark-web-api.dev.Dockerfile
    ports:
      - '127.0.0.1:4001:4001'
    volumes:
      - ./api:/app/api
      - /app/api/node_modules
      - wallet-data:/wallet-data:ro
    environment:
      - PORT=4001
      - WALLET_DIR=/wallet-data/.bark
      - BARKD_URL=http://barkd:4000
      - ARK_SERVER=${ARK_SERVER:-}
      - CHAIN_SOURCE=${CHAIN_SOURCE:-}
      - BITCOIND_RPC_URL=${BITCOIND_RPC_URL:-}
      - BITCOIND_RPC_COOKIE_FILE=${BITCOIND_RPC_COOKIE_FILE:-}
      - BARK_NETWORK=${BARK_NETWORK:-signet}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:4001/health >/dev/null 2>&1 || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      - barkd

  barkd:
    build:
      context: .
      dockerfile: docker/barkd.Dockerfile
      args:
        BARK_VERSION: ${BARK_VERSION:-0.6.0}
        BARKD_SHA256_AMD64: ${BARKD_SHA256_AMD64:-}
        BARKD_SHA256_ARM64: ${BARKD_SHA256_ARM64:-}
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - wallet-data:/data

volumes:
  wallet-data:
  vite-cache:
