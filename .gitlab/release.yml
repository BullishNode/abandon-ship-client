.release-rules-gitlab:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_PROJECT_URL =~ /^https:\/\/gitlab\.com\/ark-bitcoin\/bark-web$/

release:
  stage: release
  extends: .release-rules-gitlab
  image:
    name: registry.2nd.dev/build-bark-web:1
    pull_policy: if-not-present
  tags:
    - privileged
  script:
    - bash scripts/podman-build.sh --push

build-web-artifact:
  stage: release
  extends: .release-rules-gitlab
  image: nixos/nix:latest
  cache: []
  script:
    - nix --extra-experimental-features 'nix-command flakes' build .#dist
    # -h: `result` is a symlink into the nix store, dereference it.
    - tar -czhf "bark-web-${CI_COMMIT_TAG}.tar.gz" -C result .
    - 'curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "bark-web-${CI_COMMIT_TAG}.tar.gz" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bark-web/${CI_COMMIT_TAG}/bark-web-${CI_COMMIT_TAG}.tar.gz"'

release-web:
  stage: release
  extends: .release-rules-gitlab
  needs:
    - build-web-artifact
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - 'release-cli create --tag-name "${CI_COMMIT_TAG}" --name "bark-web ${CI_COMMIT_TAG}" --assets-link "{\"name\":\"bark-web-${CI_COMMIT_TAG}.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bark-web/${CI_COMMIT_TAG}/bark-web-${CI_COMMIT_TAG}.tar.gz\",\"link_type\":\"package\"}"'
