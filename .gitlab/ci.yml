install:
  stage: .pre
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: check
  needs: [install]
  script:
    - npm run check

typecheck:
  stage: check
  needs: [install]
  script:
    - npm run typecheck

test:
  stage: test
  needs: [install]
  script:
    - npm test
